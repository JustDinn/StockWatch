<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    #chart { width: 100%; height: 100%; position: relative; }
    .separator-overlay {
      position: absolute;
      left: 0;
      width: 100%;
      height: 12px;
      background-color: rgba(0, 122, 255, 0.15);
      pointer-events: none;
      display: none;
      z-index: 10;
      transform: translateY(-50%);
    }
  </style>
</head>
<body>
  <div id="chart">
    <div id="overlay-container"></div>
  </div>
  <script src="https://unpkg.com/lightweight-charts@5.1.0/dist/lightweight-charts.standalone.production.js"></script>
  <script>
    var chart = LightweightCharts.createChart(document.getElementById('chart'), {
      layout: {
        background: { type: 'solid', color: 'transparent' },
        textColor: '#888888',
        panes: {
          separatorColor: '#888888',
          enableResize: true
        }
      },
      grid: {
        vertLines: { color: 'rgba(128,128,128,0.15)' },
        horzLines: { color: 'rgba(128,128,128,0.15)' }
      },
      localization: {
        dateFormat: 'yyyy-MM-dd'
      },
      timeScale: {
        borderColor: 'rgba(128,128,128,0.3)',
        timeVisible: false
      },
      rightPriceScale: {
        borderColor: 'rgba(128,128,128,0.3)'
      },
      handleScroll: true,
      handleScale: true
    });

    var candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: '#ef5350',
      downColor: '#1976d2',
      borderUpColor: '#ef5350',
      borderDownColor: '#1976d2',
      wickUpColor: '#ef5350',
      wickDownColor: '#1976d2'
    });

    var maSeriesMap = {};
    var volumeSeries = null;
    var volumeMASeries = null;
    var upColorHex = '#ef5350';
    var downColorHex = '#1976d2';

    function formatVolume(price) {
      var abs = Math.abs(price);
      if (abs >= 1e9) return (price / 1e9).toFixed(abs >= 10e9 ? 1 : 2).replace(/\.?0+$/, '') + 'B';
      if (abs >= 1e6) return (price / 1e6).toFixed(abs >= 10e6 ? 1 : 2).replace(/\.?0+$/, '') + 'M';
      if (abs >= 1e3) return (price / 1e3).toFixed(abs >= 10e3 ? 1 : 2).replace(/\.?0+$/, '') + 'K';
      return String(Math.round(price));
    }

    function setColors(bodyUp, bodyDown, borderUp, borderDown, wickUp, wickDown) {
      upColorHex = bodyUp;
      downColorHex = bodyDown;
      candleSeries.applyOptions({
        upColor: bodyUp,
        downColor: bodyDown,
        borderUpColor: borderUp,
        borderDownColor: borderDown,
        wickUpColor: wickUp,
        wickDownColor: wickDown
      });
    }

    var isReady = false;

    function setData(jsonString) {
      try {
        var data = JSON.parse(jsonString);
        isReady = false;
        candleSeries.setData(data);
        chart.timeScale().fitContent();
        setTimeout(function() { isReady = true; }, 600);
      } catch (e) {}
    }

    function appendOlderData(jsonString) {
      try {
        var olderData = JSON.parse(jsonString);
        var currentData = candleSeries.data();
        var merged = olderData.concat(currentData);
        var seen = {};
        merged = merged.filter(function(d) {
          if (seen[d.time]) return false;
          seen[d.time] = true;
          return true;
        });
        merged.sort(function(a, b) { return a.time - b.time; });
        var visibleRange = chart.timeScale().getVisibleLogicalRange();
        candleSeries.setData(merged);
        if (visibleRange) {
          var addedCount = merged.length - currentData.length;
          chart.timeScale().setVisibleLogicalRange({
            from: visibleRange.from + addedCount,
            to: visibleRange.to + addedCount
          });
        } else {
          chart.timeScale().fitContent();
        }
      } catch (e) {}
    }

    function clearMovingAverages() {
      for (var key in maSeriesMap) {
        chart.removeSeries(maSeriesMap[key]);
      }
      maSeriesMap = {};
    }

    function setMovingAverages(jsonString) {
      try {
        clearMovingAverages();
        var maLines = JSON.parse(jsonString);
        for (var i = 0; i < maLines.length; i++) {
          var line = maLines[i];
          var series = chart.addSeries(LightweightCharts.LineSeries, {
            color: line.color,
            lineWidth: line.lineWidth,
            priceLineVisible: false,
            lastValueVisible: false
          });
          series.setData(line.data);
          maSeriesMap[line.period] = series;
        }
      } catch (e) {
        console.error('Failed to set moving averages:', e);
      }
    }

    function updatePaneHeights() {
      try {
        var panes = chart.panes();
        var volumeActive = !!volumeSeries;
        var rsiActive = !!rsiSeries;

        if (volumeActive && rsiActive) {
          if (panes.length > 1) panes[1].setHeight(40);
          if (panes.length > 2) panes[2].setHeight(40);
        } else if (volumeActive) {
          if (panes.length > 1) panes[1].setHeight(80);
        } else if (rsiActive) {
          // RSI만 있을 경우 (Volume이 없으면 RSI는 Pane 1에 그려짐)
          if (panes.length > 1) panes[1].setHeight(80);
        }


      } catch (e) {
        console.error('Failed to update pane heights:', e);
      }
    }

    function setVolumeData(jsonString) {
      try {
        var data = JSON.parse(jsonString);
        if (!volumeSeries) {
          volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
            priceFormat: { type: 'custom', formatter: formatVolume, minMove: 1 },
            priceScaleId: 'right',
            priceLineVisible: false,
            lastValueVisible: true
          }, 1);
          
          volumeSeries.priceScale().applyOptions({
            visible: true,
            autoScale: true,
            scaleMargins: { top: 0.1, bottom: 0 },
            ticksVisible: true,
            borderVisible: false
          });
        }
        volumeSeries.setData(data);
        updatePaneHeights();
      } catch (e) {
        console.error('Failed to set volume data:', e);
      }
    }

    function appendOlderVolumeData(jsonString) {
      try {
        if (!volumeSeries) return;
        var olderData = JSON.parse(jsonString);
        var currentData = volumeSeries.data();
        var merged = olderData.concat(currentData);
        var seen = {};
        merged = merged.filter(function(d) {
          if (seen[d.time]) return false;
          seen[d.time] = true;
          return true;
        });
        merged.sort(function(a, b) { return a.time - b.time; });
        volumeSeries.setData(merged);
      } catch (e) {
        console.error('Failed to append older volume data:', e);
      }
    }

    function clearVolume() {
      clearVolumeMA();
      if (volumeSeries) {
        chart.removeSeries(volumeSeries);
        volumeSeries = null;
      }
      updatePaneHeights();
    }

    function setVolumeMA(jsonString) {
      try {
        if (!volumeSeries) return;
        var line = JSON.parse(jsonString);
        clearVolumeMA();
        volumeMASeries = chart.addSeries(LightweightCharts.LineSeries, {
          color: line.color,
          lineWidth: line.lineWidth,
          priceLineVisible: false,
          lastValueVisible: false
        }, 1);
        volumeMASeries.setData(line.data);
      } catch (e) {
        console.error('Failed to set volume MA:', e);
      }
    }

    function clearVolumeMA() {
      if (volumeMASeries) {
        chart.removeSeries(volumeMASeries);
        volumeMASeries = null;
      }
    }

    var rsiSeries = null;
    var rsiUpperPriceLine = null;
    var rsiMiddlePriceLine = null;
    var rsiLowerPriceLine = null;
    var rsiBandSeries = null;

    function setRSIData(jsonString) {
      try {
        var payload = JSON.parse(jsonString);
        var data = payload.data;
        var lineColor = payload.lineColor || '#7B1FA2';
        var lineWidth = payload.lineWidth || 1;
        var upperEnabled = payload.upperEnabled;
        var upperValue = payload.upperValue;
        var middleEnabled = payload.middleEnabled;
        var middleValue = payload.middleValue;
        var lowerEnabled = payload.lowerEnabled;
        var lowerValue = payload.lowerValue;
        var bgEnabled = payload.bgEnabled;
        var bgColor = payload.bgColor || '#333333';
        var volumeEnabled = payload.volumeEnabled;

        clearRSI();

        // RSI 전용 Pane index: 볼륨이 활성이면 Pane 2, 아니면 Pane 1
        var rsiPaneIndex = volumeEnabled ? 2 : 1;

        // RSI LineSeries
        rsiSeries = chart.addSeries(LightweightCharts.LineSeries, {
          color: lineColor,
          lineWidth: lineWidth,
          priceLineVisible: false,
          lastValueVisible: true,
          priceScaleId: 'rsi'
        }, rsiPaneIndex);

        rsiSeries.priceScale().applyOptions({
          visible: true,
          autoScale: true,
          borderVisible: false
        });

        rsiSeries.setData(data);

        // 수평선 추가 (PriceLine)
        if (upperEnabled) {
          rsiUpperPriceLine = rsiSeries.createPriceLine({
            price: upperValue,
            color: 'rgba(255, 82, 82, 0.8)',
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: ''
          });
        }
        if (middleEnabled) {
          rsiMiddlePriceLine = rsiSeries.createPriceLine({
            price: middleValue,
            color: 'rgba(150, 150, 150, 0.8)',
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: ''
          });
        }
        if (lowerEnabled) {
          rsiLowerPriceLine = rsiSeries.createPriceLine({
            price: lowerValue,
            color: 'rgba(41, 182, 246, 0.8)',
            lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed,
            axisLabelVisible: true,
            title: ''
          });
        }

        // 배경 음영: 하한선~상한선 구간 AreaSeries
        if (bgEnabled && lowerEnabled && upperEnabled && data.length > 0) {
          var hex = bgColor.replace('#', '');
          var r = parseInt(hex.substring(0, 2), 16);
          var g = parseInt(hex.substring(2, 4), 16);
          var b = parseInt(hex.substring(4, 6), 16);
          var bgFill = 'rgba(' + r + ',' + g + ',' + b + ',0.15)';

          rsiBandSeries = chart.addSeries(LightweightCharts.AreaSeries, {
            topColor: bgFill,
            bottomColor: bgFill,
            lineColor: 'rgba(0,0,0,0)',
            lineWidth: 0,
            priceLineVisible: false,
            lastValueVisible: false,
            crosshairMarkerVisible: false,
            priceScaleId: 'rsi'
          }, rsiPaneIndex);

          var bandData = data.map(function(d) {
            return { time: d.time, value: upperValue };
          });
          rsiBandSeries.setData(bandData);
          rsiBandSeries.applyOptions({
            baseValue: { type: 'price', price: lowerValue }
          });
        }

        updatePaneHeights();
      } catch (e) {
        console.error('Failed to set RSI data:', e);
      }
    }

    function clearRSI() {
      try {
        rsiUpperPriceLine = null;
        rsiMiddlePriceLine = null;
        rsiLowerPriceLine = null;

        if (rsiBandSeries) {
          chart.removeSeries(rsiBandSeries);
          rsiBandSeries = null;
        }
        if (rsiSeries) {
          chart.removeSeries(rsiSeries);
          rsiSeries = null;
        }
        updatePaneHeights();
      } catch (e) {
        console.error('Failed to clear RSI:', e);
      }
    }

    var edgeDebounceTimer = null;
    chart.timeScale().subscribeVisibleLogicalRangeChange(function(range) {
      if (!range || !isReady) return;
      if (range.from <= 2) {
        if (edgeDebounceTimer) return;
        edgeDebounceTimer = setTimeout(function() {
          edgeDebounceTimer = null;
          if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.chartEdge) {
            window.webkit.messageHandlers.chartEdge.postMessage('reachedLeftEdge');
          }
        }, 500);
      }
    });

    window.addEventListener('resize', function() {
      var w = document.getElementById('chart').clientWidth;
      var h = document.getElementById('chart').clientHeight;
      chart.applyOptions({ width: w, height: h });
      if (candleSeries.data().length > 0) {
        chart.timeScale().fitContent();
      }
    });

    // Mobile Touch Feedback with Overlay Sync
    var chartContainer = document.getElementById('chart');
    var overlayContainer = document.getElementById('overlay-container');
    var defaultSeparatorColor = '#888888';
    var activeSeparatorColor = 'rgba(0, 122, 255, 0.5)';
    var isTouching = false;
    var activeSeparatorIndex = -1; // Added to track which separator is being touched
    var rafId = null;
    var TOUCH_THRESHOLD = 20; // 20px threshold for touch precision

    function syncOverlays() {
      try {
        var panes = chart.panes();
        if (panes.length < 2) {
          overlayContainer.innerHTML = '';
          return;
        }

        var needed = panes.length - 1;
        while (overlayContainer.children.length < needed) {
          var div = document.createElement('div');
          div.className = 'separator-overlay';
          overlayContainer.appendChild(div);
        }
        while (overlayContainer.children.length > needed) {
          overlayContainer.removeChild(overlayContainer.lastChild);
        }

        var currentY = 0;
        for (var i = 0; i < needed; i++) {
          currentY += panes[i].getHeight();
          var overlay = overlayContainer.children[i];
          overlay.style.top = currentY + 'px';
          // Only show overlay for the specific active separator if touching
          overlay.style.display = (isTouching && i === activeSeparatorIndex) ? 'block' : 'none';
        }
      } catch (e) {
        console.error('Failed to sync overlays:', e);
      }
      
      if (isTouching) {
        rafId = requestAnimationFrame(syncOverlays);
      }
    }

    chartContainer.addEventListener('touchstart', function(e) {
      if (!e.touches || e.touches.length === 0) return;
      
      var touchY = e.touches[0].clientY;
      var panes = chart.panes();
      var currentY = 0;
      activeSeparatorIndex = -1;

      // Check each separator position
      for (var i = 0; i < panes.length - 1; i++) {
        currentY += panes[i].getHeight();
        if (Math.abs(touchY - currentY) <= TOUCH_THRESHOLD) {
          activeSeparatorIndex = i;
          break;
        }
      }

      if (activeSeparatorIndex !== -1) {
        isTouching = true;
        chart.applyOptions({
          layout: {
            panes: {
              separatorColor: activeSeparatorColor
            }
          }
        });
        syncOverlays();
      }
    }, { passive: true });

    chartContainer.addEventListener('touchend', function() {
      if (!isTouching) return;
      isTouching = false;
      activeSeparatorIndex = -1;
      if (rafId) cancelAnimationFrame(rafId);
      chart.applyOptions({
        layout: {
          panes: {
            separatorColor: defaultSeparatorColor
          }
        }
      });
      syncOverlays();
    }, { passive: true });

    chartContainer.addEventListener('touchcancel', function() {
      if (!isTouching) return;
      isTouching = false;
      activeSeparatorIndex = -1;
      if (rafId) cancelAnimationFrame(rafId);
      chart.applyOptions({
        layout: {
          panes: {
            separatorColor: defaultSeparatorColor
          }
        }
      });
      syncOverlays();
    }, { passive: true });
  </script>
</body>
</html>
